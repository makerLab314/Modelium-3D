name: Release

# Tag driven: `git tag v0.3.0 && git push --tags`.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build a release for
        required: true

# One-time setup for the npm job, which is not visible from this file alone:
# npmjs.com → the modelium-3d package → Settings → Trusted Publisher, set to
# GitHub Actions, repository makerLab314/Modelium-3D, workflow `release.yml`,
# environment left blank. npm can only offer that form for a package that
# already exists, so the very first version has to go up by hand from a laptop
# (`npm publish`). Every version after it comes from here.
#
# No NPM_TOKEN anywhere in this repo, and there must never be one: the npm job
# below authenticates with a short-lived OIDC token minted per run. A long-lived
# token in secrets is the thing that gets stolen; this cannot be, because it does
# not outlive the job.
#
# Job-level permissions only. The npm job needs id-token: write and nothing else,
# and granting that here would hand it to the tarball/image job too.
permissions: {}

jobs:
  release:
    name: Tarball and image
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    # The npm job checks out the same ref. On workflow_dispatch that is the
    # input, not github.ref — see the meta step for why.
    outputs:
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm test

      # Must pass before anything is published anywhere: it is what stands
      # between a live API token and the internet.
      - run: npm run pack:check

      # Two things that are only correct if computed here.
      #
      # On a tag push github.ref_name is the tag; on workflow_dispatch it is the
      # branch, so the tag has to come from the input instead — otherwise every
      # step below quietly works on the wrong ref.
      #
      # And container registries reject uppercase in a repository name, so the
      # owner has to be lowercased. "makerLab314" would fail the push outright.
      - name: Resolve the tag and image name
        id: meta
        run: |
          echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/modelium-3d" >> "$GITHUB_OUTPUT"

      - name: Check the tag matches package.json
        run: |
          tag="${{ steps.meta.outputs.tag }}"
          tag="${tag#v}"
          version=$(node -p "require('./package.json').version")
          test "$tag" = "$version" \
            || { echo "::error::tag $tag does not match package.json version $version"; exit 1; }

      - name: Build the tarball
        id: pack
        run: echo "file=$(npm pack | tail -1)" >> "$GITHUB_OUTPUT"

      # This is the .git-free download: source without history, tests or CI.
      - name: Attach it to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          files: ${{ steps.pack.outputs.file }}
          generate_release_notes: true

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest

  npm:
    name: Publish to npm
    runs-on: ubuntu-latest

    # Last, on purpose. A release is all-or-nothing: if the tarball or the image
    # failed, the registry should not get a version the other two do not have.
    # npm is the irreversible one — a tag can be moved and an image retagged,
    # but a published version can only be unpublished within 72 hours.
    needs: release

    permissions:
      contents: read
      # This one line is the whole credential. It lets the runner request an
      # OIDC token from GitHub describing *this* workflow in *this* repo, which
      # npm trades for publish rights after matching it against the trusted
      # publisher configured on the package. Nothing is stored on either side.
      id-token: write

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.tag }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # Writes the .npmrc that points publish at the public registry. Without
          # it npm has no registry to present the OIDC token to.
          registry-url: https://registry.npmjs.org

      # Node 22 ships npm 10, which predates trusted publishing entirely and
      # fails with an auth error rather than anything that names the cause.
      #
      # Pinned to a major, not @latest. @latest is what broke v0.5.0: npm 12
      # landed, changed the shape of `pack --json`, and took the release with it.
      # A major line still gets fixes without changing behaviour under us, and it
      # also keeps npm from outrunning the Node version above — npm 12 already
      # requires Node >= 22.22, and npm 13 may well want 24.
      - name: Get an npm that understands OIDC
        run: |
          npm install -g npm@12
          npm --version

      # This job re-runs both gates rather than trusting the other job's word for
      # it. They are cheap, and the registry is the one place where being wrong
      # is permanent.
      - run: npm test
      - run: npm run pack:check

      # workflow_dispatch exists to rebuild a release for an existing tag, and on
      # that path the version is already up. Republishing is impossible by
      # design, so treat it as done rather than as a failure — otherwise every
      # rebuild ends in a red X that means nothing.
      - name: Is this version already on the registry?
        id: published
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "modelium-3d@$version" version >/dev/null 2>&1; then
            echo "::notice::modelium-3d@$version is already published — nothing to do"
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      # --provenance signs the build with the same OIDC identity, so npmjs.com
      # can show which commit and which workflow produced the tarball. It checks
      # package.json's repository.url against the repo running this, which is why
      # that field has to stay pointed at the real repo.
      - name: Publish
        if: steps.published.outputs.needed == 'true'
        run: npm publish --provenance
