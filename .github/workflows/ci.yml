name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 06:20 UTC daily. The point of this repo's CI is the live job below: the
    # three upstreams are unofficial and change without notice, so the schedule
    # is what turns "a site broke" into a notification instead of a bug report.
    - cron: '20 6 * * *'
  workflow_dispatch:

# Nothing here needs write access, and nothing here needs a secret.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      # No dependencies to install — the project has none.
      - run: npm test

  package:
    name: Package contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Asserts what `npm publish` would actually upload. The failure this
      # guards against is shipping server/.env with a live API token in it,
      # which cannot be undone once it reaches the registry. It has already
      # caught that once: npm gives the "files" allowlist the last word, so the
      # .npmignore entry everyone reaches for first does nothing.
      - run: npm run pack:check

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - run: docker build -t modelium-3d:ci .

      - name: Boot it and check the security posture
        run: |
          docker run -d --name modelium -p 8787:8787 modelium-3d:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8787/api/health >/dev/null && break
            sleep 1
          done

          health=$(curl -fsS http://127.0.0.1:8787/api/health)
          echo "$health"
          echo "$health" | grep -q '"mode":"server"' || { echo "::error::image did not start in server mode"; exit 1; }

          # Assert the state before hunting for the token, so a broken image says
          # *why*. A /data the node user cannot write to shows up here as
          # "disabled" — the container looks healthy and is unconfigurable, which
          # is exactly how this check earned its place.
          echo "$health" | grep -q '"setup":"open"' \
            || { echo "::error::setup window is not open — is /data writable by uid 1000?"; exit 1; }

          # The claim token is printed once, to the log, and must appear in no
          # response body: that is the whole basis of the first-run window.
          token=$(docker logs modelium 2>&1 | grep -oE '[A-Za-z0-9_-]{43}' | head -1)
          test -n "$token" || { echo "::error::no setup token in the log"; exit 1; }

          for route in /api/health /api/settings /api/sources; do
            if curl -fsS "http://127.0.0.1:8787$route" | grep -qF "$token"; then
              echo "::error::the setup token leaked through $route"
              exit 1
            fi
          done

          # Server mode must not hand out the config path either.
          curl -fsS http://127.0.0.1:8787/api/settings | grep -q '"readOnly":true' \
            || { echo "::error::settings are not read-only in server mode"; exit 1; }

      - name: Container log on failure
        if: failure()
        run: docker logs modelium || true

  structure:
    name: Upstream structure (${{ matrix.node }})
    runs-on: ubuntu-latest
    # A site being down must not fail a pull request; the scheduled run is what
    # this job is for. Read the annotation, do not treat a red X here as a code
    # regression.
    continue-on-error: ${{ github.event_name == 'pull_request' }}

    strategy:
      fail-fast: false
      matrix:
        node: [20]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      # Hits printables.com, makerworld.com and (only if a token is configured)
      # api.thingiverse.com, and asserts that each still returns the fields the
      # adapters read. Thingiverse skips itself when THINGIVERSE_TOKEN is empty,
      # so no secret is required for this to be useful.
      - name: Check the three sites still return the expected shape
        run: npm run test:live
        env:
          THINGIVERSE_TOKEN: ${{ secrets.THINGIVERSE_TOKEN }}

      - name: Explain a failure
        if: failure()
        run: |
          echo "::warning::A source changed shape or was unreachable."
          echo "This job talks to live sites. A failure usually means one of them"
          echo "changed its API or page structure — see server/sources/ for the"
          echo "adapter that needs updating. It can also just be a transient outage"
          echo "or a bot filter reacting to GitHub's network."
